<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1e3a">
  <title>寶島鐵道大亨</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 全螢幕地圖 -->
    <div id="mapWrap"><div id="mapPad"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div></div>

    <!-- 上方 HUD：日期／目的地／選單 -->
    <div id="hudTop">
      <div id="dateCard" class="win"><div id="month"></div><div id="yearInfo"></div></div>
      <button id="goalInfo" class="win goalCard" type="button"></button>
      <div class="hudBtns">
        <button id="btnSound" class="win iconBtn" type="button" aria-label="聲音開關">🔊</button>
        <button id="btnLog" class="win iconBtn" type="button" aria-label="記錄">📜</button>
        <button id="btnMenu" class="win iconBtn" type="button" aria-label="選單">☰</button>
      </div>
    </div>

    <!-- 玩家資訊 -->
    <div id="players"></div>

    <!-- 右側地圖按鈕 -->
    <div class="mapBtns">
      <button id="zoomIn" class="win" type="button" aria-label="放大">＋</button>
      <button id="zoomOut" class="win" type="button" aria-label="縮小">－</button>
      <button id="btnOverview" class="win" type="button" aria-label="全國地圖"></button>
      <button id="zoomFocus" class="win" type="button" aria-label="回到目前玩家">◎</button>
    </div>

    <!-- 下方：狀態列、指令視窗、訊息視窗 -->
    <div id="status" class="win hidden"></div>
    <div id="cmd" class="win hidden"></div>
    <div id="msg" class="win hidden"></div>

    <!-- 演出 -->
    <div id="banner"></div>
    <div id="diceOverlay" class="hidden"><div class="diceRow"></div><div class="diceText"></div></div>
    <div id="roulette" class="hidden"><div class="win rBox"><div class="rTitle">🚩 目的地輪盤</div><div class="rName"></div></div></div>

    <!-- 記錄抽屜 -->
    <aside id="logDrawer" class="win hidden">
      <div class="drawerHead"><b>📜 記錄</b><button id="btnLogClose" class="iconBtn" type="button" aria-label="關閉">✕</button></div>
      <div id="log"></div>
    </aside>
  </div>

  <div id="modal" class="overlay hidden"><div class="box win"></div></div>
  <div id="toasts"></div>

  <!-- 首頁：之後的登入、遊戲紀錄、設定都從這裡進入 -->
  <div id="home" class="overlay home hidden">
    <div class="box win homeBox">
      <div class="homeTop">
        <span class="acct">👤 訪客</span>
        <button id="hLogin" class="btn sm" type="button" disabled title="即將推出">登入</button>
      </div>
      <div class="homeLogo">🚂</div>
      <h1>寶島鐵道大亨</h1>
      <p class="sub">搭火車環島、買下全台名產，成為台灣第一的鐵道大亨！</p>
      <div class="homeMenu">
        <button id="hContinue" class="btn primary homeBtn hidden" type="button"></button>
        <button id="hLocal" class="btn primary homeBtn" type="button">🎮 開始遊戲<small>同一台裝置輪流玩，可以加入電腦</small></button>
        <button id="hOnline" class="btn homeBtn" type="button">🌐 線上對戰<small>和朋友各用自己的手機或電腦</small></button>
        <div class="homeRow">
          <button id="hRecords" class="btn homeBtn" type="button" disabled>🏆 遊戲紀錄<small>即將推出</small></button>
          <button id="hSettings" class="btn homeBtn" type="button">⚙️ 設定<small>音樂・音效</small></button>
          <button id="hRules" class="btn homeBtn" type="button">📖 規則<small>怎麼玩</small></button>
        </div>
      </div>
    </div>
  </div>

  <div id="setup" class="overlay hidden">
    <div class="box win setupBox">
      <button id="btnHome" class="linkBtn backBtn" type="button">← 回首頁</button>
      <h1>🚂 寶島鐵道大亨</h1>
      <p class="sub">搭火車環島、買下全台名產，成為台灣第一的鐵道大亨！ <button id="btnRules2" class="linkBtn" type="button">遊戲規則</button></p>
      <div class="tabs">
        <button class="tab on" data-mode="local" type="button">📱 同一台裝置</button>
        <button class="tab" data-mode="online" type="button">🌐 線上對戰</button>
      </div>

      <div id="localPane">
        <div id="pRows"></div>
        <div class="opts">
          <label>遊戲年數
            <select id="years"><option value="1">1 年（試玩）</option><option value="3" selected>3 年</option><option value="5">5 年</option><option value="10">10 年</option><option value="20">20 年</option></select>
          </label>
          <label>電腦速度
            <select id="speed"><option value="normal">普通</option><option value="fast">快</option></select>
          </label>
        </div>
        <div id="setupErr" class="err"></div>
        <div class="btns">
          <button id="btnStart" class="btn primary" type="button">開始遊戲</button>
        </div>
      </div>

      <div id="onlinePane" class="hidden">
        <div id="netForm">
          <label class="field">你的名字 <input type="text" id="myName" maxlength="6" value="玩家"></label>
          <div class="netChoice">
            <div class="netCard">
              <b>建立房間</b>
              <p class="hint">你當房主設定遊戲，把房間代碼傳給朋友。</p>
              <button id="btnHost" class="btn primary" type="button">建立房間</button>
            </div>
            <div class="netCard">
              <b>加入房間</b>
              <p class="hint">輸入朋友給你的 4 碼代碼。</p>
              <div class="joinRow">
                <input type="text" id="joinCode" maxlength="4" placeholder="代碼" autocomplete="off" autocapitalize="characters">
                <button id="btnJoin" class="btn" type="button">加入</button>
              </div>
            </div>
          </div>
        </div>
        <div id="lobby"></div>
        <div id="netErr" class="err"></div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/net.js"></script>
</body>
</html>
